# Render blueprint for Prolorg (Phase 1).
#
# Hosting plan: free "sleepy" web service (sleeps after 15 min idle).
# Phase 1 needs NO database — the Prisma schema is forward-looking for Phase 2+,
# which will wire the shared paid Postgres (same pattern as REMU's DynaSleepy).
#
# Nothing here is provisioned until you deploy this repo on Render.

services:
  - type: web
    name: prolorg
    runtime: node
    plan: free # sleepy: sleeps after 15 min idle; upgrade to `starter` ($7/mo) to keep awake
    buildCommand: npm install && npx prisma generate && npm run build # npm install (not ci): no lockfile is generated in this sandbox; Render's network reaches the registry
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SITE_URL
        value: https://prolorg.onrender.com # change to your domain when you add one
      - key: NEXT_PUBLIC_SITE_URL
        value: https://prolorg.onrender.com # change to your domain when you add one
