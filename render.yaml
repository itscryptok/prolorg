# Render blueprint for Prolorg (Phase 2).
#
# Hosting plan: free "sleepy" web service (sleeps after 15 min idle) + a
# SEPARATE `prolorg` database on the existing paid Postgres server (emus-db).
# Same $6/mo server, no extra cost; REMU's database is untouched.
#
# Nothing here is provisioned until you deploy this repo on Render.

services:
  - type: web
    name: prolorg
    runtime: node
    plan: free # sleepy: sleeps after 15 min idle; upgrade to `starter` ($7/mo) to keep awake
    buildCommand: npm install && npx prisma generate && if [ -n "$DATABASE_URL" ]; then dbname=$(printf '%s' "$DATABASE_URL" | sed -E 's#^[a-zA-Z][a-zA-Z0-9+.-]*://[^/]*/([^/?]+).*#\1#'); if [ "$dbname" = "prolorg" ]; then npx prisma migrate deploy; else echo "skipping migrate: DATABASE_URL dbname is '$dbname', not 'prolorg'"; fi; fi && npm run build # npm install (not ci): no lockfile is generated in this sandbox; Render's network reaches the registry
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SITE_URL
        value: https://aiprolice.onrender.com # change to your domain when you add one
      - key: NEXT_PUBLIC_SITE_URL
        value: https://aiprolice.onrender.com # change to your domain when you add one
      # DATABASE_URL is set manually in the Render dashboard (secret): the
      # emus-db external/internal URL with the dbname swapped to `prolorg`.
